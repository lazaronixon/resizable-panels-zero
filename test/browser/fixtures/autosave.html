<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>resizable-panels-zero — autosave</title>
    <script src="/layout_shift.js"></script>
    <link rel="stylesheet" href="/pages.css">
    <script type="module" src="/setup.js"></script>
  </head>
  <body>
    <main>
      <resizable-group id="group-one" autosave="group-one" style="height: 100px">
        <resizable-panel id="left" min-size="50px"><div>id: left</div></resizable-panel>
        <resizable-panel id="center" min-size="50px"><div>id: center</div></resizable-panel>
        <resizable-panel id="right" min-size="50px"><div>id: right</div></resizable-panel>
      </resizable-group>

      <resizable-group id="group-two" autosave="group-two" orientation="vertical" style="min-height: 140px">
        <resizable-panel id="top" min-size="30px"><div>id: top</div></resizable-panel>
        <resizable-separator></resizable-separator>
        <resizable-panel id="bottom" min-size="30px"><div>id: bottom</div></resizable-panel>
      </resizable-group>

      <!-- Panel default sizes in every unit; each must paint at its size
           without shifting once the group mounts. -->
      <resizable-group id="size-percent" class="default-size">
        <resizable-panel id="size-percent-left"><div>left</div></resizable-panel>
        <resizable-panel id="size-percent-right" default-size="25%"><div>right: 25%</div></resizable-panel>
      </resizable-group>

      <resizable-group id="size-px" class="default-size">
        <resizable-panel id="size-px-left"><div>left</div></resizable-panel>
        <resizable-panel id="size-px-right" default-size="100px"><div>right: 100px</div></resizable-panel>
      </resizable-group>

      <resizable-group id="size-vw" class="default-size">
        <resizable-panel id="size-vw-left"><div>left</div></resizable-panel>
        <resizable-panel id="size-vw-right" default-size="25vw"><div>right: 25vw</div></resizable-panel>
      </resizable-group>

      <resizable-group id="size-rem" class="default-size">
        <resizable-panel id="size-rem-left"><div>left</div></resizable-panel>
        <resizable-panel id="size-rem-right" default-size="15rem"><div>right: 15rem</div></resizable-panel>
      </resizable-group>

      <resizable-group id="size-zero" class="default-size">
        <resizable-panel id="size-zero-left"><div>left</div></resizable-panel>
        <resizable-panel id="size-zero-right" default-size="0px"><div>right: 0</div></resizable-panel>
      </resizable-group>
    </main>
  </body>
</html>
